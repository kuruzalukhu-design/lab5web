<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum JavaScript Dasar</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        transition: background-color 0.3s ease;
      }
      button {
        margin: 5px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .section-box {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #fafafa;
      }
    </style>
  </head>
  <body>
    <h1>Pengenalan JavaScript dan Manipulasi DOM</h1>
    <p id="pesan">Konten awal.</p>

    <!-- Latihan 6: Form Cek Bilangan Genap/Ganjil -->
    <div class="section-box">
      <h3>Cek Bilangan Genap / Ganjil</h3>
      <label for="bilangan">Masukkan bilangan bulat: </label>
      <input type="number" id="bilangan" step="1" />
      <button type="button" onclick="cekBilangan()">Periksa</button>
      <p id="hasilBilangan"></p>
    </div>

    <!-- Latihan 7: Tombol Ubah Warna Latar -->
    <div class="section-box">
      <h3>Ubah Warna Latar Halaman</h3>
      <button type="button" onclick="ubahWarnaLatar('lightgreen')">
        Latar Hijau
      </button>
      <button type="button" onclick="ubahWarnaLatar('white')">
        Latar Putih
      </button>
      <button type="button" onclick="ubahWarnaLatar('lightyellow')">
        Latar Kuning
      </button>
    </div>

    <!-- Latihan 8: Checkbox Menu Makanan -->
    <div class="section-box">
      <h3>Daftar Menu Makanan</h3>
      <label
        ><input type="checkbox" class="menu" value="5000" /> Ayam Goreng
        Rp5.000</label
      ><br />
      <label
        ><input type="checkbox" class="menu" value="500" /> Tempe Rp500</label
      ><br />
      <label
        ><input type="checkbox" class="menu" value="2500" /> Telur Dadar
        Rp2.500</label
      ><br />
      <p>Total: Rp<span id="total">0</span></p>
    </div>

    <!-- Menghubungkan berkas JavaScript eksternal -->
    <script src="script.js"></script>
  </body>
</html>
